<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My BLOGS</title>
    <style>
      .top {
        margin: 0px;
        border: 1px solid black;
        padding: 10px;
        width: 100vw;
        height: 7vh;
        background-color: aqua;
        /* display: grid;
        justify-content: end;
        align-items: center; */
        display: flex;
        align-items:center;
        justify-content: flex-end;
        box-sizing: border-box;
      }
      .topic {
        margin: 0px;
        border: 1px solid black;
        padding: auto;
        height: 100vh;
        width: 20vw;
        background-color: blueviolet;
        box-sizing: border-box;
      }
      .read {
        margin: 0px;
        border: 1px solid black;
        padding: auto;
        height: 100vh;
        width: 80vw;
        background-color: gold;
        box-sizing: border-box;
      }
      .main {
        display: inline-flex;
        box-sizing: border-box;
      }
      footer {
        margin: 0px;
        border: 1px solid black;
        padding: auto;
        width: 100vw;
        height: 20vh;
        background-color: brown;
        box-sizing: border-box;
      }
      button {
        position: relative;
        width: 100px;
        height: 30px;
        border: 1px solid rebeccapurple;
        background-color: rgb(129, 129, 240);
        color: red;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <nav class="top">
      <button class=""><a href="login.html">Log In</a></button>
    </nav>
    <main class="main">
      <aside>
        <div class="topic"></div>
      </aside>
      <article class="read"></article>
    </main>
    <footer></footer>
  </body>
</html>
